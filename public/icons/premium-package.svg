    <!-- Top fold lines -->
    <path fill="none" stroke="#fff" d="m174 302 338 190 338-190"/>
    <path fill="none" stroke="#fff" d="M512 492v390"/>

    <!-- Package tape / central fold -->
    <path fill="none" stroke="#fff" d="M512 492 398 428"/>
    <path fill="none" stroke="#fff" d="m512 492 114-64"/>

    <!-- Subtle box seam details -->
    <path fill="none" stroke="#fff" stroke-width="18" d="M238 338v314"/>
    <path fill="none" stroke="#fff" stroke-width="18" d="M786 338v314"/>
  </g>
</svg>