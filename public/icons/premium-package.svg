<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Premium Package Box Icon</title>
  <desc>Professional red package box icon with clean geometric folds</desc>

  <g stroke="#EF3037" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top of package -->
    <path fill="#EF3037" d="M512 112 850 302 512 492 174 302Z"/>

    <!-- Left/front face -->
    <path fill="#EF3037" d="M174 302 512 492v390L174 692Z"/>

    <!-- Right/front face -->
